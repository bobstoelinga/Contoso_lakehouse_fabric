[project]
name = "fabric-etl"
version = "0.1.0"
description = "Versioned contracts and deployment tooling for metadata-driven Fabric ETL"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fabric-etl = "fabric_etl.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "../../src"}

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["fabric_etl", "fabric_etl.*"]
