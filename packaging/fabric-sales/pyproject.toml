[project]
name = "fabric-etl-phase6"
version = "0.3.1"
description = "Metadata-driven Sales extension for the pinned Fabric framework"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "../../src"}

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["fabric_etl_phase6", "fabric_etl_phase6.*"]
