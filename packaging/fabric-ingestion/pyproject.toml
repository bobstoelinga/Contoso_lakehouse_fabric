[project]
name = "fabric-etl-phase5"
version = "0.6.1"
description = "Separately deployable Phase 5 ingestion and Quality extension for fabric-etl"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "../../src"}

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["fabric_etl_phase5", "fabric_etl_phase5.*"]
